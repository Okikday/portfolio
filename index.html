<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta
      name="description"
      content="Okikiola Gbeleyi — Software Engineer. Minimal portfolio showcasing mobile systems, open-source tooling, and architectural craft."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('og-theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F3EF')
        }
      } catch (e) {}
    </script>
    <style>
      html {
        background: #0a0a0b;
      }
      html[data-theme='light'] {
        background: #f4f3ef;
        color-scheme: light;
      }
    </style>
    <title>Okikiola Gbeleyi — Software Engineer</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
